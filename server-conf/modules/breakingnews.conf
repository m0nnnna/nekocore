[worldserver]

########################################
# Breaking News — Core Settings
########################################

#   BreakingNews.Enable
#       Description: Enable the Breaking News panel on the character screen.
#       Default:     0 - Disabled
#                    1 - Enabled

BreakingNews.Enable = 1

#   BreakingNews.Title
#       Description: Title displayed above the breaking news body.
#       Note:        Escape  '  [  ]  \  characters with a backslash.
#       Default:     "Breaking News"

BreakingNews.Title = "News"

#   BreakingNews.HtmlPath
#       Description: Path to an HTML file used as the news body.
#                    Can be absolute or relative to the worldserver binary.
#       Note:        If the file is not found, auto-generated server stats
#                    are shown instead. Delete or leave empty to always use
#                    the auto-generated content.
#       Default:     "./Updates.html"

BreakingNews.HtmlPath = "/azerothcore/env/dist/etc/modules/Updates.html"

#   BreakingNews.Cache
#       Description: Cache the news content at startup / config reload.
#                    0 - Reload from file / DB on every character screen login
#                    1 - Cache at startup (better performance, recommended)
#       Default:     1

BreakingNews.Cache = 0

#   BreakingNews.Verbose
#       Description: Write debug logs for each Warden payload sent.
#       Note:        Do NOT enable in production — it will spam the log.
#       Default:     0 - Disabled
#                    1 - Enabled

BreakingNews.Verbose = 0

########################################
# Breaking News — Auto-Generated Stats
# (used when HtmlPath file is missing)
########################################

#   BreakingNews.TopCount
#       Description: How many entries to show in each leaderboard section.
#       Range:       1 - 10
#       Default:     3

BreakingNews.TopCount = 3

# --- Toggle individual sections (1 = show, 0 = hide) ---

#   BreakingNews.Show.OnlineCount
#       Description: Show the current number of online players.
#       Default:     1

BreakingNews.Show.OnlineCount = 1

#   BreakingNews.Show.TopGuild
#       Description: Show the top guild leaderboard (requires Guild Points module).
#       Default:     1

BreakingNews.Show.TopGuild = 0

#   BreakingNews.Show.TopArena
#       Description: Show the top 3v3 arena team leaderboard.
#       Default:     1

BreakingNews.Show.TopArena = 0

#   BreakingNews.Show.TopKiller
#       Description: Show the top PvP killer leaderboard.
#       Default:     1

BreakingNews.Show.TopKiller = 1

#   BreakingNews.Show.TopAchievement
#       Description: Show the top achievement points leaderboard.
#       Default:     1

BreakingNews.Show.TopAchievement = 1

#   BreakingNews.Show.News
#       Description: Show the server news lines defined below.
#       Default:     1

BreakingNews.Show.News = 1

########################################
# Breaking News — Server News Lines
#
# Lines are shown in order. Stop adding lines when you want to stop.
# Supports up to 20 lines (Line1 … Line20).
# Escape  '  [  ]  \  with a backslash.
#
# To add a clickable link inside the HTML file (not the config lines),
# use WoW SimpleHTML link syntax:
#   |Hurl:https://yoursite.com|hClick here|h
########################################

BreakingNews.News.Line1 = "Welcome to Nekocore"
BreakingNews.News.Line2 = "Soft launch/beta"
BreakingNews.News.Line3 = "Follow n0cturn4lly on X for updates"
BreakingNews.News.Line4 = ""
# BreakingNews.News.Line5 = ""
# BreakingNews.News.Line6 = ""
