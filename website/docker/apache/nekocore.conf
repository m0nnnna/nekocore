# Apache vhost tweaks for the NekoCore website container.

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.php
</Directory>

# Library code is required by the pages, never served directly.
<Directory /var/www/html/inc>
    Require all denied
</Directory>

# Legacy JSON announcements (only needed by the importer).
<Directory /var/www/html/data>
    Require all denied
</Directory>

# The client zip is large; let it stream and cache.
<Directory /var/www/html/downloads>
    Options -Indexes
    Header set Cache-Control "public, max-age=3600"
</Directory>

# Behind a reverse proxy (Caddy/nginx/Cloudflare)? Trust its scheme header so
# verification links come out as https://.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

ServerTokens Prod
ServerSignature Off
